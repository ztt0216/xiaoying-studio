services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: studio
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-studio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-studio}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空）时执行建表与初始化数据
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      # 走 TCP：初始化阶段的临时 mysqld 不监听网络，避免脚本未跑完就判定健康
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/studio?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ${MYSQL_USER:-studio}
      DB_PASSWORD: ${MYSQL_PASSWORD:-studio}
      STORAGE_DIR: /data
      SIM_STEP_DELAY_MS: ${SIM_STEP_DELAY_MS:-3000}
      SIM_FAIL_STAGE: ${SIM_FAIL_STAGE:-NONE}
      WORKER_THREADS: ${WORKER_THREADS:-2}
    volumes:
      - uploads:/data
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://backend:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: on-failure

volumes:
  mysql-data:
  uploads:
